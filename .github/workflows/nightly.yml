name: DCI Verification

on:
  schedule:
    - cron: '0 0 * * *'
  pull_request:
    branches: [ main ]

permissions: read-all

jobs:
  verify-dci:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Install dependencies
      run: go mod tidy

    - name: Build binary
      run: make build

    - name: Verify config functionality
      run: |
        ./go-dci config set -a ${{ secrets.DCI_ACCESS_KEY }} -s ${{ secrets.DCI_SECRET_KEY }}

        if [ $? -ne 0 ]; then
          echo "Failed to set config"
          exit 1
        fi

    - name: Verify read-only commands functionality
      run: |
        set -euo pipefail

        run_smoke() {
          local command="$*"

          echo "Verifying go-dci ${command}..."
          if ! ./go-dci "$@" > /dev/null; then
            echo "Failed to verify go-dci ${command}"
            exit 1
          fi
        }

        run_smoke identity
        run_smoke topics --name go-dci-nightly-smoke-probe
        run_smoke components --name go-dci-nightly-smoke-probe
        run_smoke products
        run_smoke teams --name go-dci-nightly-smoke-probe
        run_smoke users --name go-dci-nightly-smoke-probe
        run_smoke remotecis
        run_smoke jobstates --job-id 00000000-0000-0000-0000-000000000000
        run_smoke jobs --age 1
        run_smoke ocpcount --age 1
